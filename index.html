<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="正多面体やフラードームを生成し、360度回転して観察できる3D図形ビューワー">
<title>3D図形ラボ</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#e8f1ff;background:#07111f;font-size:16px}
body{margin:0}button,select,input{font:inherit}button,select{border:1px solid #36506b;border-radius:8px;background:#132940;color:inherit;min-height:44px}button{cursor:pointer;min-width:44px;padding:6px 9px}select{width:100%;padding:6px 9px}
button:hover{background:#204566}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #ffd76a;outline-offset:2px}button:disabled{opacity:.42;cursor:default}button[aria-pressed="true"],button[aria-expanded="true"]{background:#205ea0;border-color:#83bcff}
#app{height:100vh;height:100dvh;min-height:240px;display:grid;grid-template-rows:auto minmax(0,1fr);background:#07111f}
header{display:flex;align-items:center;gap:6px;padding:2px max(8px,env(safe-area-inset-right)) 2px max(12px,env(safe-area-inset-left));border-bottom:1px solid #25364a;background:#0d1b2c}
h1{font-size:1rem;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0;flex:1;min-width:0}header button{font-size:.8125rem}#status{font-size:.75rem;color:#a9bed7;white-space:nowrap}
#work{min-width:0;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) auto auto}
#viewer{position:relative;min-width:0;min-height:0;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}
#requestDock{position:absolute;left:50%;bottom:12px;z-index:2;transform:translateX(-50%);width:min(620px,calc(100% - 24px));padding:6px;border:1px solid rgba(137,190,245,.3);border-radius:13px;background:rgba(8,22,38,.88);box-shadow:0 8px 28px rgba(0,0,0,.34);backdrop-filter:blur(10px)}#requestForm{display:flex;gap:6px}#requestInput{min-width:0;flex:1;height:40px;border:1px solid #36506b;border-radius:8px;background:#0b1a2c;color:#fff;padding:7px 10px}#requestSubmit{min-height:40px;background:#205ea0}.request-feedback{min-height:0;margin:0;padding:0 4px;font-size:.75rem;line-height:1.4;color:#b7c8dc}.request-feedback:not(:empty){padding-top:5px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:-12px;background:#102035;z-index:2}h2{font-size:1rem;margin:8px 0}h3{font-size:.9rem;margin:16px 0 6px}p{line-height:1.65}.row{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.row button{flex:1}label{display:block;margin:13px 0}input[type="range"]{width:100%;min-height:44px}input[type="color"]{width:100%;height:44px;border:1px solid #36506b;border-radius:8px;background:#132940;padding:4px}.small{font-size:.8rem;color:#b7c8dc}
#toolbar{width:64px;display:flex;flex-direction:column;gap:6px;align-items:center;padding:8px 4px max(8px,env(safe-area-inset-bottom));border-left:1px solid #25364a;background:#0d1b2c;overflow:auto}.tool{width:52px;min-height:48px;padding:3px 1px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.symbol{font-size:20px;line-height:20px}.tool .label{font-size:.75rem;white-space:nowrap}

#app.large .tool{min-width:52px;min-height:56px}#app.large .tool .label{font-size:.875rem}#app.large #toolbar{width:76px}#app.large #detail{font-size:1rem}
@media(max-width:768px) and (min-height:481px){#work{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto auto}#detail{width:auto;max-width:none;max-height:36dvh;border-left:0;border-top:1px solid #25364a}#toolbar,#app.large #toolbar{width:auto;flex-direction:row;justify-content:space-evenly;border-left:0;border-top:1px solid #25364a;padding:4px 6px max(4px,env(safe-area-inset-bottom));gap:4px}#toolbar .tool{flex:1;max-width:76px}#status{display:none}header{flex-wrap:wrap}header button{padding:4px 6px}#requestDock{bottom:8px;width:calc(100% - 16px)}#app.focus #work{grid-template-rows:minmax(0,1fr)}}
@media(max-height:480px){#toolbar{gap:4px}.tool{min-height:44px}header{padding-top:0;padding-bottom:0}#detail{width:min(240px,42vw)}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}

</head>
<body>
<div id="app">
 <header><h1 id="title">3D図形ラボ</h1><span id="status" role="status">準備中</span><button id="infoBtn" aria-expanded="false" aria-controls="detail">使い方</button><button id="fullBtn">全画面</button></header>
 <div id="restore" hidden><button id="restoreBtn">操作を表示</button><button id="stopBtn" hidden>回転を停止</button><span>Escでも戻れます</span></div>
 <main id="work">
  <div id="viewer" aria-label="選択した図形の3D表示">
   <div id="requestDock">
    <form id="requestForm"><label class="sr-only" for="requestInput">描きたい図形</label><input id="requestInput" type="text" autocomplete="off" list="requestExamples" placeholder="例：フラワーオブライフを球面に投影して"><button id="requestSubmit" type="submit">生成</button></form>
    <datalist id="requestExamples"><option value="フラワーオブライフを平面で描いて"><option value="フラワーオブライフを球面に投影して"><option value="フラワーオブライフをドームに投影して"></datalist>
    <p id="requestFeedback" class="request-feedback" role="status"></p>
   </div>
   <div id="message" role="status"><p id="messageText">3Dライブラリを読み込み中…</p><button id="retryBtn" hidden>再読み込み</button></div>
  </div>
  <aside id="detail" hidden aria-label="図形と表示の設定">
   <div class="panel-head"><h2 id="panelTitle">図形</h2><button id="closeBtn" aria-label="パネルを閉じる">閉じる</button></div>
   <section id="shapePanel" hidden>
    <label>図形<select id="shapeSelect">
     <optgroup label="正多面体"><option value="tetrahedron">正四面体</option><option value="cube">立方体</option><option value="octahedron">正八面体</option><option value="dodecahedron">正十二面体</option><option value="icosahedron" selected>正二十面体</option></optgroup>
     <optgroup label="曲面・回転体"><option value="sphere">球</option><option value="torus">トーラス</option><option value="cone">円錐</option><option value="cylinder">円柱</option></optgroup>
     <optgroup label="構造"><option value="geodesic">ジオデシック球</option><option value="dome">フラードーム</option></optgroup>
     <optgroup label="神聖幾何学"><option value="flower2d">フラワーオブライフ・平面</option><option value="flowerSphere">フラワーオブライフ・球面投影</option><option value="flowerDome">フラワーオブライフ・ドーム投影</option></optgroup>
    </select></label>
    <label id="detailLabel">細分割 <span id="detailValue">0</span><input id="detailRange" type="range" min="0" max="3" step="1" value="0"></label>
    <p id="shapeHint" class="small"></p>
   </section>
   <section id="settingsPanel" hidden>
    <h3>表示する要素</h3><div class="row"><button id="faceBtn" data-model aria-pressed="true">面</button><button id="edgeBtn" data-model aria-pressed="true">辺</button><button id="vertexBtn" data-model aria-pressed="true">頂点</button></div>
    <label>面の透明度 <span id="opacityValue">78%</span><input id="opacity" data-model type="range" min="0.08" max="1" step="0.02" value="0.78"></label>
    <label>面の色<input id="faceColor" data-model type="color" value="#2378c8"></label>
    <label>背景色<input id="backgroundColor" data-model type="color" value="#07111f"></label>
    <button id="sizeBtn" aria-pressed="false">操作表示を大きめに</button>
   </section>
   <section id="viewsPanel" hidden>
    <div class="row"><button data-view="front" data-model>正面</button><button data-view="side" data-model>側面</button></div><div class="row"><button data-view="top" data-model>上面</button><button data-view="iso" data-model>斜視</button></div><div class="row"><button id="resetBtn" data-model>初期視点に戻す</button></div>
    <h3>ボタンで操作</h3><div class="row"><button data-nudge="left" data-model>左回転</button><button data-nudge="right" data-model>右回転</button></div><div class="row"><button data-nudge="up" data-model>上回転</button><button data-nudge="down" data-model>下回転</button></div><div class="row"><button data-zoom="0.85" data-model>拡大＋</button><button data-zoom="1.18" data-model>縮小−</button></div><div class="row"><button data-pan="left" data-model>左移動</button><button data-pan="right" data-model>右移動</button></div><div class="row"><button data-pan="up" data-model>上移動</button><button data-pan="down" data-model>下移動</button></div>
   </section>
   <section id="infoPanel" hidden><p>左ドラッグ・1本指：回転<br>ホイール・ピンチ：ズーム<br>右ドラッグ・2本指：移動</p><p>「図形」で種類を選び、「設定」で面・辺・頂点、色、透明度を調整できます。</p><p id="facts"></p><p>見失ったときは「全体」。初期の向きは「視点」から戻せます。</p><p>ネット接続が必要です。WebGL対応ブラウザで利用してください。</p></section>
  </aside>
  <nav id="toolbar" aria-label="3D操作">
   <button class="tool" id="shapeBtn" aria-expanded="false" aria-controls="detail"><span class="symbol" aria-hidden="true">◆</span><span class="label">図形</span></button>
   <button class="tool" id="autoBtn" data-model aria-pressed="false" aria-label="自動回転を開始"><span class="symbol" aria-hidden="true">↻</span><span class="label">回転</span></button>
   <button class="tool" id="fitBtn" data-model aria-label="モデル全体を表示"><span class="symbol" aria-hidden="true">⤢</span><span class="label">全体</span></button>
   <button class="tool" id="viewBtn" aria-expanded="false" aria-controls="detail"><span class="symbol" aria-hidden="true">◇</span><span class="label">視点</span></button>
   <button class="tool" id="settingsBtn" aria-expanded="false" aria-controls="detail"><span class="symbol" aria-hidden="true">⚙</span><span class="label">設定</span></button>
   <button class="tool" id="focusBtn"><span class="symbol" aria-hidden="true">□</span><span class="label">集中</span></button>
  </nav>
 </main>
</div>
<script type="module">
const $=id=>document.getElementById(id),app=$('app'),container=$('viewer');
const panelButtons={shape:$('shapeBtn'),settings:$('settingsBtn'),views:$('viewBtn'),info:$('infoBtn')};let activePanel=null,opener=null;
document.querySelectorAll('[data-model]').forEach(b=>b.disabled=true);
function setPanel(name,button){const closing=!name||name===activePanel,previous=opener;activePanel=closing?null:name;opener=closing?null:button;$('detail').hidden=closing;for(const[key,b]of Object.entries(panelButtons)){b.setAttribute('aria-expanded',String(key===activePanel));$(key+'Panel').hidden=key!==activePanel}if(!closing){$('panelTitle').textContent={shape:'図形を選ぶ',settings:'表示設定',views:'視点と移動',info:'使い方'}[name];$('closeBtn').focus()}else if(previous)previous.focus()}
Object.entries(panelButtons).forEach(([name,b])=>b.onclick=()=>setPanel(name,b));$('closeBtn').onclick=()=>setPanel(null);
function focusMode(on){setPanel(null);app.classList.toggle('focus',on);$('restore').hidden=!on;(on?$('restoreBtn'):$('focusBtn')).focus()}$('focusBtn').onclick=()=>focusMode(true);$('restoreBtn').onclick=()=>focusMode(false);document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(activePanel)setPanel(null);else if(app.classList.contains('focus'))focusMode(false)}});
$('sizeBtn').onclick=()=>{$('sizeBtn').setAttribute('aria-pressed',String(app.classList.toggle('large')))};$('retryBtn').onclick=()=>location.reload();
function fail(message){$('message').hidden=false;$('messageText').textContent=message;$('retryBtn').hidden=false;$('status').textContent='読込エラー'}
if(!document.fullscreenEnabled||!app.requestFullscreen)$('fullBtn').hidden=true;$('fullBtn').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await app.requestFullscreen()}catch{$('status').textContent='全画面を利用できません'}};document.addEventListener('fullscreenchange',()=>{$('fullBtn').textContent=document.fullscreenElement?'全画面解除':'全画面'});
const watchdog=setTimeout(()=>fail('読み込みに時間がかかっています。ネット接続を確認してください。'),15000);
try{
 const THREE=await import('three');const{OrbitControls}=await import('three/addons/controls/OrbitControls.js');
 const scene=new THREE.Scene();scene.background=new THREE.Color(0x07111f);const camera=new THREE.PerspectiveCamera(42,1,.01,200);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;container.appendChild(renderer.domElement);
 const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.06;controls.enablePan=true;controls.minDistance=2.2;controls.maxDistance=100;controls.autoRotate=false;controls.autoRotateSpeed=1.1;scene.add(new THREE.HemisphereLight(0xcfe8ff,0x14233b,2.1));const key=new THREE.DirectionalLight(0xffffff,3);key.position.set(5,7,6);scene.add(key);const rim=new THREE.DirectionalLight(0x68a9ff,2);rim.position.set(-5,-2,-4);scene.add(rim);
 let root=null,faceGroup=null,edgeGroup=null,vertexGroup=null,radius=2.2;const center=new THREE.Vector3(),initialDirection=new THREE.Vector3(4.3,3.4,5).normalize();
 const names={tetrahedron:'正四面体',cube:'立方体',octahedron:'正八面体',dodecahedron:'正十二面体',icosahedron:'正二十面体',sphere:'球',torus:'トーラス',cone:'円錐',cylinder:'円柱',geodesic:'ジオデシック球',dome:'フラードーム',flower2d:'フラワーオブライフ・平面',flowerSphere:'フラワーオブライフ・球面投影',flowerDome:'フラワーオブライフ・ドーム投影'};
 const hints={tetrahedron:'4面・6辺・4頂点の正多面体',cube:'6面・12辺・8頂点の正多面体',octahedron:'8面・12辺・6頂点の正多面体',dodecahedron:'12面・30辺・20頂点の正多面体',icosahedron:'20面・30辺・12頂点の正多面体',sphere:'緯線・経線で構成した球面',torus:'中心に穴を持つ回転面',cone:'円形の底面と1つの頂点を持つ立体',cylinder:'2つの円形面を持つ立体',geodesic:'正二十面体を細分化して球面へ投影した構造',dome:'ジオデシック球の上半分を取り出したドーム',flower2d:'19個の同径円で構成する神聖幾何学模様',flowerSphere:'フラワーオブライフを球面座標へ投影',flowerDome:'フラワーオブライフを半球ドームへ投影'};
 function domeGeometry(detail){const source=new THREE.IcosahedronGeometry(2,detail).toNonIndexed(),p=source.attributes.position,array=[];for(let i=0;i<p.count;i+=3){const tri=[0,1,2].map(j=>new THREE.Vector3().fromBufferAttribute(p,i+j));if(tri.every(v=>v.y>=-.025)){for(const v of tri)array.push(v.x,v.y,v.z)}}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(array,3));g.computeVertexNormals();g.translate(0,-1.98,0);return g}
 function geometryFor(type,detail){switch(type){case'tetrahedron':return new THREE.TetrahedronGeometry(2,0);case'cube':return new THREE.BoxGeometry(3,3,3);case'octahedron':return new THREE.OctahedronGeometry(2,0);case'dodecahedron':return new THREE.DodecahedronGeometry(2,0);case'icosahedron':return new THREE.IcosahedronGeometry(2,detail);case'sphere':return new THREE.SphereGeometry(2,48,32);case'torus':return new THREE.TorusGeometry(1.5,.55,24,64);case'cone':return new THREE.ConeGeometry(1.6,3.5,48,1);case'cylinder':return new THREE.CylinderGeometry(1.45,1.45,3.3,48,1);case'geodesic':return new THREE.IcosahedronGeometry(2,Math.max(1,detail));case'dome':return domeGeometry(Math.max(1,detail))}}
 function flowerCenters(circleRadius=.72){const centers=[];for(let q=-2;q<=2;q++)for(let r=-2;r<=2;r++)if(Math.max(Math.abs(q),Math.abs(r),Math.abs(q+r))<=2)centers.push(new THREE.Vector2(circleRadius*(q+r/2),circleRadius*Math.sqrt(3)*r/2));return centers}
 function flowerCurveGroup(mapPoint){const group=new THREE.Group(),circleRadius=.72,material=new THREE.MeshStandardMaterial({color:0xbfe9ff,emissive:0x2c8fd5,emissiveIntensity:1.35,roughness:.28,metalness:.12});for(const c of flowerCenters(circleRadius)){const points=[];for(let i=0;i<96;i++){const a=i/96*Math.PI*2;points.push(mapPoint(c.x+Math.cos(a)*circleRadius,c.y+Math.sin(a)*circleRadius))}const curve=new THREE.CatmullRomCurve3(points,true,'catmullrom',.35);group.add(new THREE.Mesh(new THREE.TubeGeometry(curve,128,.022,6,true),material))}return group}

 function uniqueVertices(geometry,max=160){const p=geometry.attributes.position,map=new Map;for(let i=0;i<p.count;i++){const v=new THREE.Vector3().fromBufferAttribute(p,i),k=[v.x,v.y,v.z].map(n=>Math.round(n*1e5)).join(',');map.set(k,v);if(map.size>max)return null}return[...map.values()]}
 function setVisible(button,obj,on){if(obj)obj.visible=on;button.disabled=!obj;button.setAttribute('aria-pressed',String(!!obj&&on))}
 function build(){const type=$('shapeSelect').value,detail=Number($('detailRange').value),isFlower=type.startsWith('flower');if(root){scene.remove(root);root.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){const ms=Array.isArray(o.material)?o.material:[o.material];ms.forEach(m=>m.dispose())}})}root=new THREE.Group();scene.add(root);faceGroup=new THREE.Group();edgeGroup=new THREE.Group();vertexGroup=new THREE.Group();root.add(faceGroup,edgeGroup,vertexGroup);let viewDirection=initialDirection.clone();
  if(isFlower)viewDirection=buildFlower(type);else{const geometry=geometryFor(type,detail),material=new THREE.MeshStandardMaterial({color:$('faceColor').value,roughness:.52,metalness:.06,transparent:true,opacity:Number($('opacity').value),side:THREE.DoubleSide,flatShading:!['sphere','torus','cone','cylinder'].includes(type)});faceGroup.add(new THREE.Mesh(geometry,material));edgeGroup.add(new THREE.LineSegments(new THREE.EdgesGeometry(geometry,type==='sphere'||type==='torus'?28:1),new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.88})));

  $('title').textContent=names[type]+'｜3D図形ラボ';$('shapeHint').textContent=hints[type];$('status').textContent=names[type];const usesDetail=['icosahedron','geodesic','dome'].includes(type);$('detailLabel').hidden=!usesDetail;if(type==='geodesic'||type==='dome'){if(detail<1){$('detailRange').value='1';return build()}}fit(viewDirection);history.replaceState(null,'',location.pathname+'?shape='+type+'&detail='+$('detailRange').value)}
 function auto(on){controls.autoRotate=on;$('autoBtn').setAttribute('aria-pressed',String(on));$('autoBtn').setAttribute('aria-label',on?'自動回転を停止':'自動回転を開始');$('autoBtn').querySelector('.label').textContent=on?'停止':'回転';$('stopBtn').hidden=!on}controls.addEventListener('start',()=>auto(false));$('autoBtn').onclick=()=>auto(!controls.autoRotate);$('stopBtn').onclick=()=>auto(false);matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',e=>{if(e.matches)auto(false)});

 $('fitBtn').onclick=()=>fit();$('resetBtn').onclick=()=>fit(initialDirection);const directions={front:new THREE.Vector3(0,0,1),side:new THREE.Vector3(1,0,0),top:new THREE.Vector3(0,1,.0001).normalize(),iso:initialDirection};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>fit(directions[b.dataset.view]));
 for(const[id,get]of[['faceBtn',()=>faceGroup],['edgeBtn',()=>edgeGroup],['vertexBtn',()=>vertexGroup]])$(id).onclick=()=>{const obj=get();obj.visible=!obj.visible;$(id).setAttribute('aria-pressed',String(obj.visible))};
 $('opacity').oninput=e=>{const v=Number(e.target.value);$('opacityValue').textContent=Math.round(v*100)+'%';faceGroup.children.forEach(m=>m.material.opacity=v)};$('faceColor').oninput=e=>faceGroup.children.forEach(m=>m.material.color.set(e.target.value));$('backgroundColor').oninput=e=>scene.background.set(e.target.value);
 function shapeFromRequest(value){const text=value.normalize('NFKC').toLowerCase().replace(/\s+/g,'');if(/フラワー.?オブ.?ライフ|flower.?of.?life/.test(text)){if(/ドーム|半球|dome/.test(text))return'flowerDome';if(/球面|球体|sphere|球に|球へ/.test(text))return'flowerSphere';return'flower2d'}const words=[['正二十面体|icosahedron','icosahedron'],['正十二面体|dodecahedron','dodecahedron'],['正八面体|octahedron','octahedron'],['正四面体|tetrahedron','tetrahedron'],['立方体|cube','cube'],['ジオデシック','geodesic'],['フラードーム','dome'],['トーラス|torus','torus'],['円柱|cylinder','cylinder'],['円錐|cone','cone'],['球|sphere','sphere']];for(const[word,type]of words)if(new RegExp(word).test(text))return type;return null}
 $('requestForm').onsubmit=e=>{e.preventDefault();const value=$('requestInput').value.trim(),type=shapeFromRequest(value);if(!value){$('requestFeedback').textContent='描きたい図形を入力してください。';$('requestInput').focus();return}if(!type){$('requestFeedback').textContent='現在はフラワーオブライフ、正多面体、球、トーラス、円錐、円柱、フラードームに対応しています。';return}$('shapeSelect').value=type;build();$('requestFeedback').textContent=`「${names[type]}」として表示しました。`;setTimeout(()=>{$('requestFeedback').textContent=''},5000)};

 document.querySelectorAll('[data-nudge]').forEach(b=>b.onclick=()=>{const s=new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target)),d=b.dataset.nudge;s.theta+=(d==='left'?.15:d==='right'?-.15:0);s.phi+=(d==='up'?-.15:d==='down'?.15:0);s.makeSafe();place(controls.target.clone().add(new THREE.Vector3().setFromSpherical(s)),controls.target.clone())});
 document.querySelectorAll('[data-zoom]').forEach(b=>b.onclick=()=>{const v=camera.position.clone().sub(controls.target);v.setLength(THREE.MathUtils.clamp(v.length()*Number(b.dataset.zoom),controls.minDistance,controls.maxDistance));place(controls.target.clone().add(v),controls.target.clone())});document.querySelectorAll('[data-pan]').forEach(b=>b.onclick=()=>{const d=b.dataset.pan,axis=new THREE.Vector3().setFromMatrixColumn(camera.matrix,d==='left'||d==='right'?0:1),delta=axis.multiplyScalar(camera.position.distanceTo(controls.target)*.06*(d==='left'||d==='down'?1:-1));place(camera.position.clone().add(delta),controls.target.clone().add(delta))});
 function resize(){const w=container.clientWidth,h=container.clientHeight;if(w<1||h<1)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}resize();new ResizeObserver(resize).observe(container);renderer.domElement.addEventListener('webglcontextlost',e=>{e.preventDefault();fail('3D描画が中断されました。再読み込みしてください。')});
 const q=new URLSearchParams(location.search),requested=q.get('shape');if(names[requested])$('shapeSelect').value=requested;const qDetail=Number(q.get('detail'));if(Number.isInteger(qDetail)&&qDetail>=0&&qDetail<=3){$('detailRange').value=String(qDetail);$('detailValue').textContent=String(qDetail)}build();let last=performance.now();function animate(now){const dt=Math.min((now-last)/1000,.1);last=now;controls.update(dt);renderer.render(scene,camera);requestAnimationFrame(animate)}requestAnimationFrame(animate);document.querySelectorAll('[data-model]').forEach(b=>b.disabled=false);clearTimeout(watchdog);$('message').hidden=true;
}catch(error){clearTimeout(watchdog);console.error(error);fail('3D表示を開始できませんでした。ネット接続とWebGL対応を確認してください。')}
